<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Colón | Panel Médico</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="cm-navbar">
        <div class="cm-nav-left">
            <img class="cm-logo" src="/img/media-3556053682.jpg" alt="Clínica Colón">
            <div>
                <h1>Clínica Colón</h1>
                <small>Panel del Médico · Consultora Médica</small>
            </div>
        </div>
        <button class="cm-tab btn-logout" style="color:#fff; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.4);">Cerrar sesión</button>
    </nav>

    <main class="cm-container">
        <div class="cm-hero">
            <h2>Panel del Médico</h2>
            <p>Turnos pendientes, información de pacientes e historias clínicas</p>
        </div>
        <div class="cm-card">
            <h2>Mis Turnos Pendientes</h2>
            <div id="tablaTurnos"></div>
        </div>
    </main>

    <script src="/js/utils/auth_helper.js"></script>
    <script src="/js/services/api_service.js"></script>
    <script src="/js/components/ui_handlers.js"></script>
    <script src="/js/front_controllers/doctor_front_controller.js"></script>
</body>
</html>
